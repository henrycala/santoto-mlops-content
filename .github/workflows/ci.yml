name: Tests en cada PR

# Pruebas en cada pull request y en cada push a main.
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: actividades/actividad-3

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Tests
        run: poetry run pytest
