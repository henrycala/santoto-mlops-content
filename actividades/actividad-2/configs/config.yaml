# Configuración del proyecto (actividad 2).
# Todo lo que puede cambiar (datos, modelo, MLflow) vive aquí, no en el código.

datos:
  ruta: ../data/Customer-Churn-Records.csv   # relativa a actividades/actividad-2/

division:
  test_size: 0.2
  random_state: 42          # también se registra como semilla en MLflow

# Conjuntos de features. Cada candidato se entrena con cada uno: un run por combinación.
#   columnas: ALL para todas las variables, o una lista con los nombres exactos del CSV.
features:
  - nombre: all
    columnas: ALL
  - nombre: custom
    columnas:
      - Age
      - Balance
      - NumOfProducts
      - IsActiveMember
      - Geography

# Modelos que el flow de entrenamiento compara. Cada uno se entrena con cada conjunto de `features`.
# Cada run se llama `<nombre_run>-<nombre de features>`. Solo el de mayor AUC se evalúa para champion.
candidatos:
  - nombre_run: churn-logreg-c1
    tipo: logistic_regression
    parametros:
      C: 1.0
      max_iter: 1000
  - nombre_run: churn-logreg-c01
    tipo: logistic_regression
    parametros:
      C: 0.1
      max_iter: 1000
  - nombre_run: churn-gbt
    tipo: gradient_boosting
    parametros:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 3
      random_state: 42

mlflow:
  tracking_uri: http://localhost:5000  # servidor de MLflow de services/. Sin servidor: sqlite:///mlflow.db. MLFLOW_TRACKING_URI, si existe, tiene prioridad
  experimento: churn-training-mlops    # nombre del experimento donde se agrupan los runs
  nombre_run: churn-training           # nombre de cada run dentro del experimento

metricas:
  umbral: 0.5                          # probabilidad a partir de la cual se predice churn (Exited = 1)

# Actividad 2: registro del modelo e inferencia.
registro:
  nombre_modelo: churn-modelo   # nombre en el Model Registry de MLflow
  umbral_auc: 0.80              # AUC mínimo para ser champion; además debe superar al champion actual

inferencia:
  tamano_lote: 100              # clientes que se puntúan en cada ejecución diaria
  carpeta_salida: ../data       # relativa a actividades/actividad-2/ (la carpeta del dataset)
