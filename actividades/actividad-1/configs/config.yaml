# Configuración del proyecto (actividad 1).
# Todo lo que puede cambiar (datos, modelo, MLflow) vive aquí, no en el código.

datos:
  ruta: ../data/Customer-Churn-Records.csv   # relativa a actividades/actividad-1/

division:
  test_size: 0.2
  random_state: 42          # también se registra como semilla en MLflow

modelo:
  tipo: logistic_regression   # logistic_regression | gradient_boosting
  parametros:                 # argumentos del estimador de sklearn
    C: 1.0
    max_iter: 1000

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experimento: churn-mlops
